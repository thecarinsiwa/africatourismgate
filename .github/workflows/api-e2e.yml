name: API E2E

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'database/**'
      - '.github/workflows/api-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'database/**'
      - '.github/workflows/api-e2e.yml'
  workflow_dispatch:

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: africatourismgate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: africatourismgate_test
      SEED_ADMIN_PASSWORD: ChangeMe123!
      JWT_ACCESS_SECRET: ci-e2e-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-min-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API e2e tests
        run: pnpm --filter @africatourismgate/api test:e2e
