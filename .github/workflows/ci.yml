name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: africatourismgate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # API e2e (isolated test DB)
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: africatourismgate_test
      SEED_ADMIN_PASSWORD: ChangeMe123!
      JWT_ACCESS_SECRET: ci-e2e-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-min-32-chars-long
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_e2e_test_secret_for_signature_only
      # Next.js build (public URLs)
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      NEXT_PUBLIC_WEB_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build shared packages
        run: pnpm --filter @africatourismgate/types build

      - name: Build API, admin, web
        run: >-
          pnpm --filter @africatourismgate/api
          --filter @africatourismgate/admin
          --filter @africatourismgate/web
          build

      - name: Sync test database schema
        run: pnpm db:sync

      - name: API e2e tests
        run: pnpm --filter @africatourismgate/api test:e2e
