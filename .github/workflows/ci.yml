name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: africatourismgate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # API e2e (isolated test DB)
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: africatourismgate_test
      SEED_ADMIN_PASSWORD: ChangeMe123!
      JWT_ACCESS_SECRET: ci-e2e-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-min-32-chars-long
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_e2e_test_secret_for_signature_only
      # Next.js build (public URLs)
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      NEXT_PUBLIC_WEB_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check web i18n parity
        run: pnpm check:web-i18n

      - name: Build shared packages
        run: pnpm --filter @africatourismgate/types --filter @africatourismgate/utils build

      - name: Build API, admin, web
        run: >-
          pnpm --filter @africatourismgate/api
          --filter @africatourismgate/admin
          --filter @africatourismgate/web
          build

      - name: Sync test database schema
        run: pnpm db:sync

      - name: API e2e tests
        run: pnpm --filter @africatourismgate/api test:e2e

  pos:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: africatourismgate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: africatourismgate_test
      SEED_ADMIN_PASSWORD: ChangeMe123!
      JWT_ACCESS_SECRET: ci-e2e-access-secret-min-32-chars-long
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-min-32-chars-long
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_e2e_test_secret_for_signature_only
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_POS_URL: http://localhost:3003

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @africatourismgate/types --filter @africatourismgate/utils build

      - name: Lint POS
        run: pnpm --filter @africatourismgate/pos lint

      - name: Build POS
        run: pnpm --filter @africatourismgate/pos build

      - name: Sync test database schema
        run: pnpm db:sync

      - name: Install Playwright browsers
        run: pnpm --filter @africatourismgate/pos exec playwright install --with-deps chromium

      - name: POS E2E tests
        run: pnpm --filter @africatourismgate/pos test:e2e

  # Build web once, then run Playwright in parallel shards (mocked API — no MySQL).
  web-e2e-build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_WEB_URL: http://localhost:3002
      NEXT_IMAGE_UNOPTIMIZED: '1'
      NEXT_DIST_DIR: .next-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @africatourismgate/types --filter @africatourismgate/utils build

      - name: Build web (E2E dist)
        run: pnpm --filter @africatourismgate/web test:e2e:ci:build

      - name: Upload web E2E build
        uses: actions/upload-artifact@v4
        with:
          name: web-next-e2e
          path: apps/web/.next-e2e
          retention-days: 1

  web-e2e:
    needs: web-e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
    env:
      CI: true
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_WEB_URL: http://localhost:3002
      NEXT_IMAGE_UNOPTIMIZED: '1'
      NEXT_DIST_DIR: .next-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @africatourismgate/types --filter @africatourismgate/utils build

      - name: Download web E2E build
        uses: actions/download-artifact@v4
        with:
          name: web-next-e2e
          path: apps/web/.next-e2e

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @africatourismgate/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @africatourismgate/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @africatourismgate/web exec playwright install-deps chromium

      - name: Web E2E shard ${{ matrix.shardIndex }}/4
        run: >-
          pnpm --filter @africatourismgate/web test:e2e:ci:run
          -- --shard=${{ matrix.shardIndex }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report-shard-${{ matrix.shardIndex }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
