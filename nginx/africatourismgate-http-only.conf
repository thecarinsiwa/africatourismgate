# Variante HTTP uniquement (avant certificats Let's Encrypt).
# Utilisée automatiquement par setup-nginx.sh si les certs SSL sont absents.
#
#   africatourismgate.org      → apps/web   (site public)
#   app-africatourismgate.org  → apps/admin (back-office)

upstream api_backend {
    server 127.0.0.1:3000;
}

upstream web_frontend {
    server 127.0.0.1:3002;
}

upstream admin_frontend {
    server 127.0.0.1:3001;
}

upstream pos_frontend {
    server 127.0.0.1:3003;
}

include /etc/nginx/snippets/atg-api-servers-http.conf;

# Site public — www → sans www
server {
    listen 80;
    listen [::]:80;
    server_name www.africatourismgate.org;
    return 301 http://africatourismgate.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name africatourismgate.org;

    location ~ ^/(login|register|forgot-password|reset-password|dashboard|organisations|utilisateurs|hebergements|reservations|parametres)(/.*)?$ {
        return 301 http://app-africatourismgate.org$request_uri;
    }

    location / {
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin — www → sans www
server {
    listen 80;
    listen [::]:80;
    server_name www.app-africatourismgate.org;
    return 301 http://app-africatourismgate.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name app-africatourismgate.org;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host app-africatourismgate.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host app-africatourismgate.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host app-africatourismgate.org;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

include /etc/nginx/snippets/atg-pos-servers-http.conf;
