# GAP (optionnel) — inclus seulement si certificat gap.africatourismgate.org présent
# Voir scripts/setup-nginx.sh

server {
    listen 80;
    listen [::]:80;
    server_name gap.africatourismgate.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gap.africatourismgate.org;

    ssl_certificate /etc/letsencrypt/live/gap.africatourismgate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gap.africatourismgate.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API publique (évite CORS navigateur — même origine que le site GAP)
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host gap.africatourismgate.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        return 301 https://$host/api$request_uri;
    }

    location / {
        proxy_pass http://gap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
